## TrialOS Core — Production Environment Overrides
## Merge on top of values.yaml: helm install trialo-core . -f values.yaml -f values-prod.yaml
## Secrets MUST be provided via sealed-secrets, Vault, or external-secrets-operator.
## Do NOT commit real secrets to this file.

global:
  imageRegistry: "registry.trialo.io"
  storageClass: "gp3"  # AWS EBS gp3 / equivalent on other clouds

# ---------------------------------------------------------------------------
# Secrets — override at deploy time via CI/CD or sealed-secrets.
# Placeholder values here will cause deployment to fail intentionally.
# ---------------------------------------------------------------------------
secrets:
  AUTH0_DOMAIN: "trialo.us.auth0.com"
  AUTH0_AUDIENCE: "https://api.trialo.io"
  # All other secrets must be injected by the deployment pipeline:
  # DATABASE_URL, ANTHROPIC_API_KEY, S3_*, KAFKA_*, STRIPE_SECRET_KEY,
  # SENDGRID_API_KEY, JWT_SECRET

# ---------------------------------------------------------------------------
# Ingress — production domain with TLS
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  host: app.trialo.io
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/strip-path: "true"
    konghq.com/plugins: "rate-limiting,jwt,cors,request-id,prometheus,response-transformer"
  tls:
    - secretName: trialo-tls
      hosts:
        - app.trialo.io

# ---------------------------------------------------------------------------
# Production service settings — higher replicas and resource limits
# ---------------------------------------------------------------------------
services:
  auth-service:
    replicaCount: 2
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      - name: SERVICE_NAME
        value: "auth-service"
      - name: PORT
        value: "8001"
      - name: LOG_LEVEL
        value: "info"

  audit-service:
    replicaCount: 2
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      - name: SERVICE_NAME
        value: "audit-service"
      - name: PORT
        value: "8002"
      - name: LOG_LEVEL
        value: "info"

  ingestion-service:
    replicaCount: 2
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    env:
      - name: SERVICE_NAME
        value: "ingestion-service"
      - name: PORT
        value: "8003"
      - name: LOG_LEVEL
        value: "info"
      - name: WORKERS
        value: "4"

  agent-runtime:
    replicaCount: 3
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "4000m"
        memory: "8Gi"
    env:
      - name: SERVICE_NAME
        value: "agent-runtime"
      - name: PORT
        value: "8004"
      - name: LOG_LEVEL
        value: "info"
      - name: OPA_URL
        value: "http://trialo-opa:8181"
      - name: MAX_CONCURRENT_RUNS
        value: "10"

  marketplace:
    replicaCount: 2
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      - name: SERVICE_NAME
        value: "marketplace"
      - name: PORT
        value: "8005"
      - name: LOG_LEVEL
        value: "info"

  notification-service:
    replicaCount: 2
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      - name: SERVICE_NAME
        value: "notification-service"
      - name: PORT
        value: "8006"
      - name: LOG_LEVEL
        value: "info"

  graphql-api:
    replicaCount: 3
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    env:
      - name: SERVICE_NAME
        value: "graphql-api"
      - name: PORT
        value: "4000"
      - name: NODE_ENV
        value: "production"

  frontend:
    replicaCount: 2
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      - name: SERVICE_NAME
        value: "frontend"
      - name: PORT
        value: "3000"
      - name: NODE_ENV
        value: "production"

  data-platform:
    replicaCount: 2
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    env:
      - name: SERVICE_NAME
        value: "data-platform"
      - name: PORT
        value: "8007"
      - name: LOG_LEVEL
        value: "info"
      - name: WORKERS
        value: "4"

# ---------------------------------------------------------------------------
# Production PostgreSQL
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    database: trialo
    existingSecret: trialo-db-secret
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "gp3"
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    podAntiAffinityPreset: hard

# ---------------------------------------------------------------------------
# Production Redis
# ---------------------------------------------------------------------------
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    existingSecret: trialo-redis-secret
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      size: 20Gi
      storageClass: "gp3"
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  replica:
    replicaCount: 2
    persistence:
      size: 20Gi
      storageClass: "gp3"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"

# ---------------------------------------------------------------------------
# Production MinIO
# ---------------------------------------------------------------------------
minio:
  enabled: true
  auth:
    existingSecret: trialo-minio-secret
  mode: distributed
  statefulset:
    replicaCount: 4
    drivesPerNode: 1
  persistence:
    size: 200Gi
    storageClass: "gp3"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# ---------------------------------------------------------------------------
# Production HPA — enabled
# ---------------------------------------------------------------------------
hpa:
  agentRuntime:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  ingestionService:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Production PDBs — enabled
# ---------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ---------------------------------------------------------------------------
# Production OPA — 2 replicas for HA
# ---------------------------------------------------------------------------
opa:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ---------------------------------------------------------------------------
# Production Kong — 2 replicas
# ---------------------------------------------------------------------------
kong:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
