apiVersion: v2
name: trialo-core
description: TrialOS core platform services
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "15.5.20"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "19.5.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: minio
    version: "14.6.21"
    repository: "https://charts.bitnami.com/bitnami"
    condition: minio.enabled
