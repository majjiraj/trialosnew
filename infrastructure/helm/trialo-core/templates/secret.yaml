apiVersion: v1
kind: Secret
metadata:
  name: trialo-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trialo-core.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  AUTH0_DOMAIN: {{ .Values.secrets.AUTH0_DOMAIN | quote }}
  AUTH0_AUDIENCE: {{ .Values.secrets.AUTH0_AUDIENCE | quote }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.ANTHROPIC_API_KEY | quote }}
  S3_ENDPOINT: {{ .Values.secrets.S3_ENDPOINT | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.S3_ACCESS_KEY | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.S3_SECRET_KEY | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.secrets.KAFKA_BOOTSTRAP_SERVERS | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.STRIPE_SECRET_KEY | quote }}
  SENDGRID_API_KEY: {{ .Values.secrets.SENDGRID_API_KEY | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
