{{- if .Values.opa.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trialo-opa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trialo-core.labels" . | nindent 4 }}
    app.kubernetes.io/name: trialo-opa
    app.kubernetes.io/component: policy-engine
spec:
  replicas: {{ .Values.opa.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trialo-opa
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trialo-opa
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: trialo
      annotations:
        checksum/policies: {{ include (print $.Template.BasePath "/opa-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "trialo-core.serviceAccountName" . }}
      {{- include "trialo-core.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opa
          image: "{{ .Values.opa.image.repository }}:{{ .Values.opa.image.tag }}"
          imagePullPolicy: {{ .Values.opa.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "run"
            - "--server"
            - "--addr"
            - ":8181"
            - "--bundle"
            - "/policies"
            - "--log-format"
            - "json"
            - "--log-level"
            - "info"
          ports:
            - name: http
              containerPort: {{ .Values.opa.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health?bundle=true
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.opa.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policies
          configMap:
            name: opa-policies
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: trialo-opa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trialo-core.labels" . | nindent 4 }}
    app.kubernetes.io/name: trialo-opa
    app.kubernetes.io/component: policy-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trialo-opa
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.opa.port }}
      targetPort: http
      protocol: TCP
{{- end }}
