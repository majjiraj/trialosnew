{{/*
Iterate over every entry in .Values.services and render a Deployment + Service
for each one that has enabled: true.
*/}}
{{- range $svcName, $svcValues := .Values.services }}
{{- if $svcValues.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "trialo-core.serviceLabels" (dict "root" $ "svcName" $svcName) | nindent 4 }}
spec:
  replicas: {{ $svcValues.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "trialo-core.serviceSelectorLabels" (dict "root" $ "svcName" $svcName) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "trialo-core.serviceSelectorLabels" (dict "root" $ "svcName" $svcName) | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "trialo-core.serviceAccountName" $ }}
      {{- include "trialo-core.imagePullSecrets" $ | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $svcName }}
          image: "{{ include "trialo-core.imageRegistry" $ }}{{ $svcValues.image.repository }}:{{ $svcValues.image.tag }}"
          imagePullPolicy: {{ $svcValues.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ $svcValues.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: trialo-secrets
            - configMapRef:
                name: trialo-config
          {{- if $svcValues.env }}
          env:
            {{- toYaml $svcValues.env | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml $svcValues.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $svcValues.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $svcValues.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "trialo-core.serviceLabels" (dict "root" $ "svcName" $svcName) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trialo-core.serviceSelectorLabels" (dict "root" $ "svcName" $svcName) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svcValues.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
