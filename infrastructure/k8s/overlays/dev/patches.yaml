---
# Scale all services down to 1 replica in dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: trialo
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: auth-service
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: debug
            - name: ENVIRONMENT
              value: development
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

