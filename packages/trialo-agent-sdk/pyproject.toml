[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trialo-agent-sdk"
version = "1.0.0"
description = "SDK for building custom TrialOS AI agents for clinical trials"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["clinical trials", "AI agents", "CDISC", "SDTM", "TrialOS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anthropic>=0.29.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.3.0",
]

[project.urls]
Homepage = "https://trialo.io"
Documentation = "https://docs.trialo.io/sdk"
Repository = "https://github.com/trialo/trialo-agent-sdk"

[tool.hatch.build.targets.wheel]
packages = ["trialo_agent_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
